
name: CROP CLASH - Project Check

on:
  push:
    branches:
      - main
      - feature/derick-cc
      - feature/kawan-cc
      - feature/rafael-cc
      - feature/samuel-cc

  pull_request:
    branches:
      - main

jobs:
  project-check:
    name: Verificar projeto Unity
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar estrutura Unity
        run: |
          test -f README.md
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          echo "Estrutura Unity validada!"

      - name: Verificar scripts C#
        run: |
          count=$(find Assets -name "*.cs" | wc -l)
          echo "Scripts encontrados: $count"

          if [ "$count" -eq 0 ]; then
            echo "Nenhum script C# encontrado!"
            exit 1
          fi
